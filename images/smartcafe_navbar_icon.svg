<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- 24K Polished Gold Gradient -->
    <linearGradient id="navGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="75%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Warm Highlight Gold -->
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Deep Luxury Obsidian/Emerald Background for Maximum Contrast -->
    <radialGradient id="badgeDark" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#142a1e" />
      <stop offset="60%" stop-color="#07130d" />
      <stop offset="100%" stop-color="#020604" />
    </radialGradient>

    <!-- Crisp Subtle Glow (won't blur at 32px) -->
    <filter id="crispGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- ==================== BASE CIRCULAR BADGE ==================== -->
  <!-- Outer Beveled 24K Gold Rim (Thick & Bold for 32px Visibility) -->
  <circle cx="64" cy="64" r="60" fill="url(#badgeDark)" stroke="url(#navGold)" stroke-width="5.5" filter="url(#crispGlow)" />
  
  <!-- Inner Gold Precision Ring -->
  <circle cx="64" cy="64" r="53" fill="none" stroke="url(#goldLight)" stroke-width="1.2" opacity="0.7" />

  <!-- 4 Cardinal Gold Diamonds for Luxury Detail -->
  <polygon points="64,8 66,11 64,14 62,11" fill="url(#navGold)" />
  <polygon points="120,64 117,66 114,64 117,62" fill="url(#navGold)" />
  <polygon points="64,120 66,117 64,114 62,117" fill="url(#navGold)" />
  <polygon points="8,64 11,66 14,64 11,62" fill="url(#navGold)" />

  <!-- ==================== CENTER MONOGRAM & CROWN ==================== -->
  <!-- Luxury Royal Crown at Top (Signifies Premium Status) -->
  <g transform="translate(64, 28)" fill="url(#navGold)">
    <!-- 3-Peak Crown -->
    <path d="M -16 8 L -12 -2 L -5 3 L 0 -5 L 5 3 L 12 -2 L 16 8 Z" stroke="#78350f" stroke-width="0.8" />
    <!-- Crown Jewels -->
    <circle cx="-12" cy="-3.5" r="1.5" fill="#ffffff" />
    <circle cx="0" cy="-6.5" r="2" fill="#ffffff" />
    <circle cx="12" cy="-3.5" r="1.5" fill="#ffffff" />
  </g>

  <!-- BOLD, CRISP INTERLOCKING "SC" (Designed for maximum readability at small scale) -->
  <g transform="translate(64, 69)">
    <!-- Shadow for Depth -->
    <path d="M 12 -26 C 2 -36, -26 -28, -26 -10 C -26 12, 14 10, 14 26 C 14 42, -14 44, -22 30" 
          fill="none" stroke="#000000" stroke-width="8" stroke-linecap="round" opacity="0.6" />
    
    <!-- Bold 'C' Outer Arc -->
    <path d="M 18 -18 C 6 -30, -22 -22, -22 4 C -22 30, 6 36, 20 22" 
          fill="none" stroke="url(#goldLight)" stroke-width="5.5" stroke-linecap="round" />

    <!-- Bold 'S' Ribbon (Primary, Thick & Radiant) -->
    <path d="M 12 -24 C 2 -34, -24 -26, -24 -8 C -24 12, 12 10, 12 24 C 12 38, -12 40, -20 28" 
          fill="none" stroke="url(#navGold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Core Diamond Sparkle -->
    <polygon points="0,-1 2.5,4 0,9 -2.5,4" fill="#ffffff" />
  </g>

  <!-- Bottom Stars / Founder Signature Accent -->
  <g transform="translate(64, 107)" fill="url(#navGold)">
    <circle cx="-8" cy="0" r="1.5" />
    <!-- Center 5-Point Star -->
    <polygon points="0,-4 1.2,-1 4.5,-1 2,0.8 2.8,4 0,2.2 -2.8,4 -2,0.8 -4.5,-1 -1.2,-1" />
    <circle cx="8" cy="0" r="1.5" />
  </g>
</svg>
