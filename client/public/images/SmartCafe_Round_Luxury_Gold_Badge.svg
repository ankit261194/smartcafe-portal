<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="roundDarkBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="60%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- 24K Multi-Stop Luxury Gold Gradient -->
    <linearGradient id="gold24k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="15%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="55%" stop-color="#ca8a04" />
      <stop offset="75%" stop-color="#fef08a" />
      <stop offset="90%" stop-color="#a16207" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Secondary Champagne Gold -->
    <linearGradient id="champagneGold" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Ring Bevel Gradient -->
    <linearGradient id="ringBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#713f12" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Luxury Drop Shadow & Glow Filters -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" opacity="0.4" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="medallionShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Text Paths for Arched Typography -->
    <!-- Top Arc Path (Clockwise from ~140deg to ~40deg) -->
    <path id="topArc" d="M 95 300 A 205 205 0 0 1 505 300" fill="none" />
    
    <!-- Bottom Arc Path (Clockwise from ~220deg to ~320deg for upright bottom text) -->
    <path id="bottomArc" d="M 505 300 A 205 205 0 0 1 95 300" fill="none" />
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');

    .round-title {
      font-family: 'Cinzel', 'Playfair Display', serif;
      font-weight: 900;
      font-size: 34px;
      letter-spacing: 9px;
    }
    .round-sub {
      font-family: 'Plus Jakarta Sans', 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 19px;
      letter-spacing: 7px;
    }
  </style>

  <!-- Canvas Background (Transparent or Dark) -->
  <rect width="600" height="600" fill="#000000" opacity="0" />

  <!-- ==================== OUTER CIRCULAR MEDALLION ==================== -->
  <g filter="url(#medallionShadow)">
    <!-- Outer Heavy Beveled 24K Gold Ring -->
    <circle cx="300" cy="300" r="285" fill="url(#roundDarkBg)" stroke="url(#gold24k)" stroke-width="9" />
    <circle cx="300" cy="300" r="275" fill="none" stroke="url(#champagneGold)" stroke-width="2" opacity="0.6" />

    <!-- Coin Beaded / Knurled Rim Detailing (60 Gold Studs) -->
    <g fill="url(#gold24k)">
      <circle cx="300" cy="24" r="3.5" />
      <circle cx="329" cy="26" r="3.5" />
      <circle cx="357" cy="30" r="3.5" />
      <circle cx="385" cy="39" r="3.5" />
      <circle cx="412" cy="51" r="3.5" />
      <circle cx="438" cy="67" r="3.5" />
      <circle cx="461" cy="87" r="3.5" />
      <circle cx="482" cy="110" r="3.5" />
      <circle cx="500" cy="135" r="3.5" />
      <circle cx="513" cy="163" r="3.5" />
      <circle cx="522" cy="191" r="3.5" />
      <circle cx="526" cy="221" r="3.5" />
      <circle cx="526" cy="250" r="3.5" />
      <circle cx="522" cy="280" r="3.5" />
      <circle cx="522" cy="320" r="3.5" />
      <circle cx="526" cy="350" r="3.5" />
      <circle cx="526" cy="379" r="3.5" />
      <circle cx="522" cy="409" r="3.5" />
      <circle cx="513" cy="437" r="3.5" />
      <circle cx="500" cy="465" r="3.5" />
      <circle cx="482" cy="490" r="3.5" />
      <circle cx="461" cy="513" r="3.5" />
      <circle cx="438" cy="533" r="3.5" />
      <circle cx="412" cy="549" r="3.5" />
      <circle cx="385" cy="561" r="3.5" />
      <circle cx="357" cy="570" r="3.5" />
      <circle cx="329" cy="574" r="3.5" />
      <circle cx="300" cy="576" r="3.5" />
      <circle cx="271" cy="574" r="3.5" />
      <circle cx="243" cy="570" r="3.5" />
      <circle cx="215" cy="561" r="3.5" />
      <circle cx="188" cy="549" r="3.5" />
      <circle cx="162" cy="533" r="3.5" />
      <circle cx="139" cy="513" r="3.5" />
      <circle cx="118" cy="490" r="3.5" />
      <circle cx="100" cy="465" r="3.5" />
      <circle cx="87" cy="437" r="3.5" />
      <circle cx="78" cy="409" r="3.5" />
      <circle cx="74" cy="379" r="3.5" />
      <circle cx="74" cy="350" r="3.5" />
      <circle cx="78" cy="320" r="3.5" />
      <circle cx="78" cy="280" r="3.5" />
      <circle cx="74" cy="250" r="3.5" />
      <circle cx="74" cy="221" r="3.5" />
      <circle cx="78" cy="191" r="3.5" />
      <circle cx="87" cy="163" r="3.5" />
      <circle cx="100" cy="135" r="3.5" />
      <circle cx="118" cy="110" r="3.5" />
      <circle cx="139" cy="87" r="3.5" />
      <circle cx="162" cy="67" r="3.5" />
      <circle cx="188" cy="51" r="3.5" />
      <circle cx="215" cy="39" r="3.5" />
      <circle cx="243" cy="30" r="3.5" />
      <circle cx="271" cy="26" r="3.5" />
    </g>

    <!-- Middle Decorative Ring Band -->
    <circle cx="300" cy="300" r="260" fill="none" stroke="url(#gold24k)" stroke-width="2.5" />
    <circle cx="300" cy="300" r="150" fill="#09090b" stroke="url(#gold24k)" stroke-width="5" filter="url(#goldGlow)" />
    <circle cx="300" cy="300" r="140" fill="none" stroke="url(#champagneGold)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />

    <!-- ==================== ARCHED CIRCULAR TEXT ==================== -->
    <!-- Top Arc: SMART CAFE -->
    <text class="round-title" fill="url(#gold24k)" filter="url(#goldGlow)">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle">
        SMART CAFE
      </textPath>
    </text>

    <!-- Bottom Arc: BY ANKIT CHAUDHARY -->
    <text class="round-sub" fill="url(#gold24k)" filter="url(#goldGlow)">
      <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
        ★ BY ANKIT CHAUDHARY ★
      </textPath>
    </text>

    <!-- Left & Right Divider Stars / Faceted Diamonds -->
    <g transform="translate(75, 300)" fill="url(#gold24k)" filter="url(#goldGlow)">
      <polygon points="0,-12 4,-3 12,0 4,3 0,12 -4,3 -12,0 -4,-3" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>
    <g transform="translate(525, 300)" fill="url(#gold24k)" filter="url(#goldGlow)">
      <polygon points="0,-12 4,-3 12,0 4,3 0,12 -4,3 -12,0 -4,-3" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>

    <!-- ==================== CENTER 3D MONOGRAM INSIGNIA (SC) ==================== -->
    <g transform="translate(300, 300)">
      <!-- Inner Sunburst / Star Ray Background -->
      <g opacity="0.12" stroke="url(#gold24k)" stroke-width="1.2">
        <line x1="0" y1="-135" x2="0" y2="135" />
        <line x1="-135" y1="0" x2="135" y2="0" />
        <line x1="-95" y1="-95" x2="95" y2="95" />
        <line x1="95" y1="-95" x2="-95" y2="95" />
      </g>

      <!-- Interlocking Sculpted 'S' and 'C' -->
      <!-- 'C' Outer Crest Arch -->
      <path d="M 45 -55 C 10 -85, -70 -55, -70 0 C -70 55, 10 85, 48 55" 
            fill="none" stroke="url(#gold24k)" stroke-width="10" stroke-linecap="round" opacity="0.9" />

      <!-- 'S' Fluid 3D Gold Ribbon -->
      <path d="M 35 -65 C 35 -98, -48 -92, -48 -48 C -48 -12, 52 -6, 52 42 C 52 92, -35 96, -52 62" 
            fill="none" stroke="url(#gold24k)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)" />

      <!-- Center Gold Core Diamond -->
      <polygon points="0,-15 5,0 0,15 -5,0" fill="url(#champagneGold)" filter="url(#goldGlow)" />

      <!-- Micro Star Apex above SC -->
      <polygon points="0,-95 4,-86 13,-86 6,-80 8,-71 0,-76 -8,-71 -6,-80 -13,-86 -4,-86" fill="url(#gold24k)" />
    </g>
  </g>
</svg>
