<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Smart Cafe e-District Helper</title>
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 14px;
      background: #0f172a;
      color: #f8fafc;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-weight: 800;
      font-size: 14px;
      color: #38bdf8;
    }
    .card {
      background: #1e293b;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #334155;
    }
    label {
      font-size: 10px;
      font-weight: bold;
      color: #94a3b8;
      display: block;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      margin-bottom: 8px;
    }
    button {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      background: #0284c7;
      color: #fff;
    }
    button:hover {
      background: #0369a1;
    }
    .status {
      font-size: 10px;
      color: #34d399;
      text-align: center;
      margin-top: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 18px;">⚡</span>
    <div class="title">स्मार्ट कैफे e-District बॉट</div>
  </div>

  <div class="card">
    <label>दुकानदार VLE ID / कैफे कोड:</label>
    <input type="text" id="cafeId" placeholder="उदा. CAFE-101" />

    <label>क्लाउड सर्वर URL:</label>
    <input type="text" id="serverUrl" value="https://smartcafe.sbs" />

    <button id="saveBtn">सहेजें (Save Config)</button>
    <div id="status" class="status">🟢 100% लाइव ब्रिज सक्रिय</div>
  </div>

  <div class="card" style="border-color: #f97316; margin-top: 10px;">
    <div style="font-weight: 800; color: #fb923c; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between;">
      <span>🔄 रेखा प्रिंट ऑटो-रिले</span>
      <span style="font-size: 9px; background: #ea580c; color: #fff; padding: 1px 6px; border-radius: 4px;">2-4h बोट</span>
    </div>
    <div style="font-size: 11px; color: #cbd5e1; margin-bottom: 6px;">
      आईडी: <b>8006518960</b> | बैलेंस: सुरक्षित
    </div>
    <div id="rekhaRelayStatusText" style="font-size: 10px; color: #34d399; margin-bottom: 8px;">
      🟢 साइलेंट ऑटो-रिले सक्रिय (10s सिंक)
    </div>
    <button id="rekhaSyncBtn" style="background: linear-gradient(135deg, #ea580c, #c2410c);">
      ⚡ अभी तुरंत रेखा प्रिंट सिंक करें
    </button>
  </div>

  <div style="font-size: 10px; color: #94a3b8; text-align: center; line-height: 1.4;">
    e-District UP फॉर्म ऑटो-फिलर और रेखा प्रिंट साइलेंट B2B रिले बैकग्राउंड में स्वतः कार्यरत हैं।
  </div>

  <script src="popup.js"></script>
</body>
</html>
